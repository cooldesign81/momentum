<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum 스코어보드 에디터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@200;300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b21;
    --panel-2: #20242c;
    --line: #2c313b;
    --text: #e8eaee;
    --muted: #8b93a1;
    --accent: #8ff0e0;
    --warn: #f2e000;
    --danger: #ff5a5a;
    --home: #111111;
    --away: #7a0a0a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    font-size: 14px;
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
  }
  button:hover { border-color: #465063; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #0b1a17; border-color: var(--accent); font-weight: 700; }
  input[type=text], input[type=number], select {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    width: 100%;
  }
  input[type=color] { width: 36px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
  kbd {
    display: inline-block; min-width: 20px; padding: 1px 6px; text-align: center;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
    background: var(--bg); font-size: 12px; font-family: ui-monospace, monospace;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 900; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header .sp { flex: 1; }
  header .file { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }

  .app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: calc(100% - 53px); }
  .main { padding: 12px 16px; overflow: hidden; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #editor { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .stage-wrap { flex: 1; min-height: 120px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .side { border-left: 1px solid var(--line); overflow: auto; background: var(--panel); }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .main { overflow: visible; }
    #editor { flex: none; }
    .stage-wrap { flex: none; height: 56vw; }
    .pads { grid-template-columns: 1fr; }
    .side { border-left: 0; border-top: 1px solid var(--line); }
  }

  .drop {
    border: 2px dashed var(--line); border-radius: 12px;
    min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    color: var(--muted); text-align: center; padding: 24px;
  }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .drop strong { color: var(--text); font-size: 16px; }

  .stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; flex: none; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage canvas { pointer-events: none; }

  .transport .q { font-weight: 900; font-size: 18px; min-width: 44px; text-align: center; }
  .transport { flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .transport .time { font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); margin-left: 6px; }
  .transport .sp { flex: 1; }
  .speed button.on { border-color: var(--accent); color: var(--accent); }

  .timeline { flex: none; position: relative; height: 30px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .timeline .trim { position: absolute; top: 0; bottom: 0; background: rgba(143,240,224,.08); border-left: 2px solid var(--accent); border-right: 2px solid var(--accent); pointer-events: none; }
  .timeline .mk { position: absolute; width: 2px; pointer-events: none; }
  .timeline .mk.h { top: 4px; height: 13px; }
  .timeline .mk.a { bottom: 4px; height: 13px; }
  .timeline .mk.q { top: 0; bottom: 0; background: #fff; opacity: .6; width: 1px; }
  .timeline .mk.f { opacity: .9; }
  .timeline .head { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--danger); pointer-events: none; }

  .pads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none; }
  .pad { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .pad .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .pad .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #555; flex: none; }
  .pad .nm { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pad .sc { font-size: 24px; line-height: 1; font-weight: 300; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .pad .row { display: grid; grid-template-columns: repeat(4, 1fr) repeat(2, .75fr); gap: 5px; }
  .pad .row button { padding: 9px 0; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
  .pad .row button kbd { font-weight: 400; }
  .pad .row button.foul { color: var(--warn); }
  .pad .row button.minor { font-weight: 400; color: var(--muted); font-size: 12px; }
  .pad .row button.foul.minor { color: #b8a93a; }
  .pad .fl { display: flex; gap: 3px; width: 90px; flex: none; }
  .pad .fl i { flex: 1; height: 6px; background: #3a3f48; border-radius: 1px; }
  .pad .fl i.on { background: var(--warn); }

  section { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  section h2 { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 700; letter-spacing: .3px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  .team-in { display: flex; gap: 6px; }
  .team-row { display: grid; grid-template-columns: 42px 1fr 36px 36px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .team-row.head { margin-bottom: 2px; font-size: 11px; color: var(--muted); }
  .team-row.head span:nth-child(n+3) { text-align: center; }
  .side-lbl { font-size: 12px; color: var(--muted); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-items: end; }
  .grid4 { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 6px; margin-top: 4px; }
  .grid4 input, .grid4 select { padding: 6px; }
  button.mini { padding: 3px 8px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 12px; color: var(--muted); align-items: center; }

  .events { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .events table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .events td { padding: 5px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .events tr:hover td { background: var(--panel-2); }
  .events tr.cur td { background: rgba(143,240,224,.08); }
  .events input.t { width: 62px; padding: 3px 5px; font-family: ui-monospace, monospace; font-size: 12px; }
  .events button { padding: 2px 7px; font-size: 12px; }
  .events .empty { padding: 16px; text-align: center; color: var(--muted); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-weight: 700; }

  .progress { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .msg { font-size: 12px; margin-top: 8px; line-height: 1.5; }
  .msg.err { color: var(--danger); }
  .styles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .styles button { padding: 4px; font-size: 11px !important; white-space: nowrap; display: flex; flex-direction: column; gap: 5px; align-items: stretch; font-size: 12px; }
  .styles button.on { border-color: var(--accent); color: var(--accent); }
  .styles canvas { width: 100%; aspect-ratio: 16 / 7; border-radius: 5px; display: block; }
  .check { display: flex; align-items: center; gap: 6px; padding-bottom: 7px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>MOMENTUM <span>SCOREBOARD</span> EDITOR</h1>
  <div class="file" id="fileName"></div>
  <div class="sp"></div>
  <button id="btnOpen">영상 열기</button>
  <input type="file" id="fileInput" accept="video/*" class="hidden">
</header>

<div class="app">
  <div class="main">
    <div class="drop" id="drop">
      <strong>경기 영상을 여기로 끌어다 놓으세요</strong>
      <div>또는 위의 <b>영상 열기</b> 버튼을 누르세요. 영상은 서버로 올라가지 않고 이 브라우저 안에서만 처리돼요.</div>
    </div>

    <div id="editor" class="hidden">
      <div class="stage-wrap" id="stageWrap">
        <div class="stage" id="stage">
          <video id="video" playsinline preload="auto"></video>
          <canvas id="overlay"></canvas>
        </div>
      </div>

      <div class="timeline" id="timeline" title="클릭해서 이동">
        <div class="trim" id="trimBox"></div>
        <div id="markers"></div>
        <div class="head" id="playhead"></div>
      </div>

      <div class="transport">
        <button id="btnPlay" title="재생/일시정지 (Space)">▶ 재생</button>
        <button data-seek="-5">-5초</button>
        <button data-seek="5">+5초</button>
        <span class="time" id="timeLabel">0:00 / 0:00</span>
        <span class="speed" id="speed">
          <button data-rate="1" class="on">1x</button>
          <button data-rate="1.5">1.5x</button>
          <button data-rate="2">2x</button>
          <button data-rate="3">3x</button>
        </span>
        <span class="sp"></span>
        <span class="q" id="curQuarter">1ST</span>
        <button id="btnNextQ">다음 쿼터 <kbd>N</kbd></button>
        <button id="btnUndo">되돌리기 <kbd>Ctrl+Z</kbd></button>
      </div>

      <div class="pads">
        <div class="pad" data-team="0">
          <div class="top"><span class="sw"></span><span class="nm"></span><span class="fl"></span><span class="sc">0</span></div>
          <div class="row">
            <button data-add="pts" data-v="1">+1 <kbd>1</kbd></button>
            <button data-add="pts" data-v="2">+2 <kbd>2</kbd></button>
            <button data-add="pts" data-v="3">+3 <kbd>3</kbd></button>
            <button data-add="foul" data-v="1" class="foul">파울 <kbd>4</kbd></button>
            <button data-add="pts" data-v="-1" class="minor">-1 <kbd>Q</kbd></button>
            <button data-add="foul" data-v="-1" class="foul minor">파울-1 <kbd>R</kbd></button>
          </div>
        </div>
        <div class="pad" data-team="1">
          <div class="top"><span class="sw"></span><span class="nm"></span><span class="fl"></span><span class="sc">0</span></div>
          <div class="row">
            <button data-add="pts" data-v="1">+1 <kbd>7</kbd></button>
            <button data-add="pts" data-v="2">+2 <kbd>8</kbd></button>
            <button data-add="pts" data-v="3">+3 <kbd>9</kbd></button>
            <button data-add="foul" data-v="1" class="foul">파울 <kbd>0</kbd></button>
            <button data-add="pts" data-v="-1" class="minor">-1 <kbd>U</kbd></button>
            <button data-add="foul" data-v="-1" class="foul minor">파울-1 <kbd>P</kbd></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <aside class="side">
    <section>
      <h2>경기 정보 <button id="btnSwap" class="mini" title="왼쪽/오른쪽 팀 바꾸기">⇄ 좌우 바꾸기</button></h2>
      <div class="team-row head"><span></span><span>팀 이름</span><span>바탕</span><span>글씨</span></div>
      <div class="team-row"><span class="side-lbl">왼쪽</span><input type="text" id="t0name"><input type="color" id="t0color" title="바탕색 (유니폼 색)"><input type="color" id="t0text" title="팀 이름 글씨색"></div>
      <div class="team-row"><span class="side-lbl">오른쪽</span><input type="text" id="t1name"><input type="color" id="t1color" title="바탕색 (유니폼 색)"><input type="color" id="t1text" title="팀 이름 글씨색"></div>
      <div class="grid4">
        <div class="field"><label>매치 표시</label><input type="text" id="matchLabel" placeholder="A vs B"></div>
        <div class="field"><label>시작 쿼터</label>
          <select id="startQ"><option value="1">1Q</option><option value="2">2Q</option><option value="3">3Q</option><option value="4">4Q</option></select>
        </div>
        <div class="field"><label>팀파울 칸</label><input type="number" id="foulSlots" min="1" max="10"></div>
        <div class="field"><label title="버튼을 늦게 누르는 만큼 앞당겨 기록">보정(초)</label><input type="number" id="lag" step="0.5" min="0" title="버튼을 늦게 누르는 만큼 앞당겨 기록 (예: 1 → 누른 시점보다 1초 앞)"></div>
      </div>
    </section>

    <section>
      <h2>점수판 모양</h2>
      <div class="styles" id="styles"></div>
      <div class="grid3">
        <div class="field"><label>위치</label>
          <select id="pos"><option value="tr">오른쪽 위</option><option value="tl">왼쪽 위</option><option value="tc">가운데 위</option><option value="br">오른쪽 아래</option><option value="bl">왼쪽 아래</option><option value="bc">가운데 아래</option></select>
        </div>
        <div class="field"><label>크기 <span id="sizeVal"></span>%</label><input type="range" id="size" min="15" max="55" step="1"></div>
        <label class="check" title="득점 순간 2초 동안 점수 칸 강조 + '+2' 배지"><input type="checkbox" id="flash"> 득점 강조</label>
      </div>
    </section>

    <section>
      <h2>기록 목록 <span id="evCount"></span></h2>
      <div class="events" id="events"></div>
      <div class="hint" style="margin-top:4px">행 클릭: 장면 이동 · 시간 직접 수정 · <b>⌖</b>: 현재 위치로 옮기기</div>
      <div class="hint">단축키: <kbd>Space</kbd> 재생 · <kbd>←</kbd><kbd>→</kbd> 5초 (Shift 1초) · 점수 버튼의 키</div>
      <div class="grid3" style="margin-top:8px">
        <button id="btnSaveJson">기록 저장</button>
        <button id="btnLoadJson">불러오기</button>
        <button id="btnClear" style="color:var(--danger)">모두 지우기</button>
      </div>
      <input type="file" id="jsonInput" accept="application/json,.json" class="hidden">
    </section>

    <section>
      <h2>내보내기</h2>
      <div class="grid3">
        <div class="field"><label>시작</label><div class="team-in"><input type="text" id="trimStart" placeholder="처음부터"><button id="btnTrimStart" title="현재 위치">⌖</button></div></div>
        <div class="field"><label>끝</label><div class="team-in"><input type="text" id="trimEnd" placeholder="끝까지"><button id="btnTrimEnd" title="현재 위치">⌖</button></div></div>
        <div class="field"><label>화질</label>
          <select id="quality" title="높음: 유튜브 업로드 권장">
            <option value="high">높음</option>
            <option value="very_high">매우 높음</option>
            <option value="medium">보통</option>
          </select>
        </div>
      </div>
      <button id="btnExport" class="primary" style="margin-top:10px;width:100%">점수판 입힌 영상 내보내기</button>
      <div id="exportBox" class="hidden" style="margin-top:10px">
        <div class="progress"><i id="exportBar"></i></div>
        <div class="grid2" style="margin-top:6px;align-items:center">
          <span class="hint" id="exportLabel"></span>
          <button id="btnCancel">취소</button>
        </div>
      </div>
      <div class="msg" id="exportMsg"></div>
      <div class="hint" style="margin-top:6px">크롬·엣지 권장. 보통 영상 길이보다 빨리 끝나요.</div>
    </section>
  </aside>
</div>

<script type="module">
const MEDIABUNNY_URL = 'https://cdn.jsdelivr.net/npm/mediabunny@1.60.0/dist/bundles/mediabunny.min.mjs';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

// ---------- state ----------
const DEFAULT_CFG = {
  teams: [{ name: '홈', color: '#111111', text: '#ffffff' }, { name: '원정', color: '#7a0a0a', text: '#ffffff' }],
  match: 'A vs B',
  startQ: 1,
  foulSlots: 5,
  lag: 0,
  style: 'bar',
  pos: 'tr',
  size: 30,
  flash: true,
  trimStart: null,
  trimEnd: null,
  quality: 'high',
};
let cfg = structuredClone(DEFAULT_CFG);
let events = [];           // {id, t, kind: 'pts'|'foul'|'q', team, v}
let undoStack = [];
let nextId = 1;
let file = null;
let storeKey = null;

const video = $('#video');
const overlay = $('#overlay');
const octx = overlay.getContext('2d');

// ---------- persistence ----------
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function save() {
  lsSet('mm-sb:last-cfg', { teams: cfg.teams, match: cfg.match, foulSlots: cfg.foulSlots, lag: cfg.lag, style: cfg.style, flash: cfg.flash, pos: cfg.pos, size: cfg.size, quality: cfg.quality });
  if (storeKey) lsSet(storeKey, { cfg, events });
}
const last = lsGet('mm-sb:last-cfg');
if (last) Object.assign(cfg, last);

// ---------- game logic ----------
function sorted() { return [...events].sort((a, b) => a.t - b.t || a.id - b.id); }
function stateAt(t) {
  const st = { t, q: cfg.startQ, score: [0, 0], fouls: [0, 0], last: [null, null] };
  for (const e of sorted()) {
    if (e.t > t) break;
    applyEvent(st, e);
  }
  return st;
}
function applyEvent(st, e) {
  if (e.kind === 'pts') {
    st.score[e.team] = Math.max(0, st.score[e.team] + e.v);
    if (st.last) st.last[e.team] = e.v > 0 ? { t: e.t, v: e.v } : null;
  }
  else if (e.kind === 'foul') st.fouls[e.team] = Math.max(0, st.fouls[e.team] + e.v);
  else if (e.kind === 'q') { st.q += 1; st.fouls = [0, 0]; }
}
function quarterLabel(q) {
  if (q <= 4) return ['', '1ST', '2ND', '3RD', '4TH'][q];
  const n = q - 4;
  return n === 1 ? 'OT' : 'OT' + n;
}

function addEvent(kind, team, v) {
  if (!file) return;
  const t = Math.max(0, video.currentTime - (Number(cfg.lag) || 0));
  const e = { id: nextId++, t, kind, team, v };
  events.push(e);
  undoStack.push(e.id);
  changed();
}
function undo() {
  while (undoStack.length) {
    const id = undoStack.pop();
    const i = events.findIndex(e => e.id === id);
    if (i >= 0) { events.splice(i, 1); changed(); return; }
  }
}
function changed() { save(); renderEvents(); renderMarkers(); renderLive(); }

// ---------- scoreboard drawing ----------
const FONT = "'Noto Sans KR', system-ui, sans-serif";
const NUM = "'Barlow Condensed', 'Noto Sans KR', sans-serif";
const STYLES = {
  // width: reference units that span `size`% of the frame; wide/flat styles use fewer so they render larger.
  bar: { label: 'ESPN 바', draw: drawBar, width: 440 },
  stack: { label: 'FIBA·KBL', draw: drawStack, width: 400 },
  glass: { label: '글래스', draw: drawGlass, width: 450 },
  classic: { label: '기존 모멘텀', draw: drawClassic, width: 525 },
};
function drawBoard(ctx, W, H, st) {
  const style = STYLES[cfg.style] || STYLES.bar;
  const u = (W * cfg.size / 100) / style.width;
  ctx.save();
  ctx.textBaseline = 'middle';
  style.draw(ctx, W, H, st, u);
  ctx.restore();
}
// Top-left corner of a w×h board for the chosen position.
function place(W, H, w, h) {
  const m = W * 0.014;
  const p = cfg.pos;
  const x = p.endsWith('l') ? m : p.endsWith('r') ? W - w - m : (W - w) / 2;
  const y = p.startsWith('t') ? m : H - h - m * 1.4;
  return [x, y];
}
// 0..1 highlight strength right after a team scores.
function flash(st, i) {
  const l = st.last[i];
  if (!cfg.flash || !l) return 0;
  const dt = st.t - l.t;
  return dt >= 0 && dt < 2 ? 1 - dt / 2 : 0;
}
function lum(hex) {
  const n = parseInt(String(hex).slice(1), 16);
  const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255].map(c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function ink(hex) { return lum(hex) > 0.45 ? '#0b0d12' : '#ffffff'; }
// Team name colour: user-chosen, or auto contrast for records saved before the option existed.
function teamInk(i) { return cfg.teams[i].text || ink(cfg.teams[i].color); }
function shade(hex, amt) {
  const n = parseInt(String(hex).slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt)));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function foulCount() { return Math.max(1, Number(cfg.foulSlots) || 5); }
function isBonus(st, i) { return st.fouls[i] >= foulCount(); }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fitText(ctx, text, weight, size, maxW, family = FONT) {
  let fs = size;
  ctx.font = `${weight} ${fs}px ${family}`;
  while (fs > 6 && ctx.measureText(text).width > maxW) {
    fs *= 0.94;
    ctx.font = `${weight} ${fs}px ${family}`;
  }
}
function scoreBadge(ctx, st, i, x, y, u, align, size = 18) {
  const a = flash(st, i);
  if (!a || !st.last[i]) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, a * 1.6);
  ctx.font = `700 ${size * u}px ${NUM}`;
  const txt = `+${st.last[i].v}`;
  const tw = ctx.measureText(txt).width + size * 0.6 * u;
  const bx = align === 'right' ? x - tw : x;
  ctx.fillStyle = '#f7d54a';
  rr(ctx, bx, y - size * 0.6 * u, tw, size * 1.2 * u, 4 * u); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.textAlign = 'center';
  ctx.fillText(txt, bx + tw / 2, y + 1 * u);
  ctx.restore();
}
function foulDots(ctx, st, i, x, y, w, u, { on = '#f7d54a', off = 'rgba(255,255,255,.22)', h = 5 } = {}) {
  const n = foulCount(), gap = 3 * u;
  const seg = (w - gap * (n - 1)) / n;
  for (let k = 0; k < n; k++) {
    ctx.fillStyle = k < st.fouls[i] ? on : off;
    rr(ctx, x + k * (seg + gap), y, seg, h * u, h * u / 2); ctx.fill();
  }
}

// ESPN-style horizontal bar: team blocks in team colour, big condensed numbers, period box on the right.
function drawBar(ctx, W, H, st, u) {
  const teamW = 250, perW = 108, h = 66, foulH = 14;
  const w = (teamW * 2 + perW) * u, bh = (h + foulH) * u;
  const [x, y] = place(W, H, w, bh);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 16 * u; ctx.shadowOffsetY = 4 * u;
  ctx.fillStyle = '#0c0e13';
  rr(ctx, x, y, w, bh, 7 * u); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.save(); rr(ctx, x, y, w, bh, 7 * u); ctx.clip();
  for (let i = 0; i < 2; i++) {
    const c = cfg.teams[i].color, tx = x + i * teamW * u;
    const g = ctx.createLinearGradient(0, y, 0, y + h * u);
    g.addColorStop(0, shade(c, 0.12)); g.addColorStop(1, shade(c, -0.18));
    ctx.fillStyle = g;
    ctx.fillRect(tx, y, teamW * u, h * u);
    // score panel
    const sw = 92 * u, sx = tx + teamW * u - sw;
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(sx, y, sw, h * u);
    const a = flash(st, i);
    if (a) { ctx.fillStyle = `rgba(255,255,255,${0.35 * a})`; ctx.fillRect(sx, y, sw, h * u); }
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = `700 ${56 * u}px ${NUM}`;
    ctx.fillText(String(st.score[i]), sx + sw / 2, y + h * u / 2 + 3 * u);
    ctx.fillStyle = teamInk(i);
    ctx.textAlign = 'left';
    fitText(ctx, cfg.teams[i].name, 700, 28 * u, teamW * u - sw - 26 * u);
    ctx.fillText(cfg.teams[i].name, tx + 16 * u, y + h * u / 2 + 1 * u);
    // foul strip
    const fy = y + h * u;
    ctx.fillStyle = '#15181f';
    ctx.fillRect(tx, fy, teamW * u, foulH * u);
    if (isBonus(st, i)) {
      ctx.fillStyle = '#f7d54a';
      ctx.font = `700 ${13 * u}px ${NUM}`;
      ctx.textAlign = 'left';
      ctx.fillText('BONUS', tx + 16 * u, fy + foulH * u / 2 + 1 * u);
    }
    foulDots(ctx, st, i, tx + 70 * u, fy + (foulH - 5) * u / 2, teamW * u - 86 * u, u);
    if (i === 0) { ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(tx + teamW * u - 1 * u, y, 1 * u, bh); }
    scoreBadge(ctx, st, i, sx + sw - 4 * u, y + 11 * u, u, 'right', 15);
  }
  // period box
  const px = x + teamW * 2 * u;
  ctx.fillStyle = '#0c0e13';
  ctx.fillRect(px, y, perW * u, bh);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = `700 ${34 * u}px ${NUM}`;
  ctx.fillText(quarterLabel(st.q), px + perW * u / 2, y + 30 * u);
  ctx.fillStyle = '#8b93a1';
  fitText(ctx, cfg.match || '', 600, 15 * u, perW * u - 14 * u, NUM);
  ctx.fillText(cfg.match || '', px + perW * u / 2, y + 60 * u);
  ctx.restore();
}

// FIBA / KBL style vertical stack: header with match + quarter, one row per team.
function drawStack(ctx, W, H, st, u) {
  const w = 400 * u, head = 34 * u, row = 56 * u, gap = 3 * u;
  const bh = head + row * 2 + gap * 2;
  const [x, y] = place(W, H, w, bh);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 14 * u; ctx.shadowOffsetY = 3 * u;
  ctx.fillStyle = '#0d1016';
  rr(ctx, x, y, w, bh, 6 * u); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.save(); rr(ctx, x, y, w, bh, 6 * u); ctx.clip();
  // header
  const hg = ctx.createLinearGradient(x, 0, x + w, 0);
  hg.addColorStop(0, '#1b2130'); hg.addColorStop(1, '#10141d');
  ctx.fillStyle = hg; ctx.fillRect(x, y, w, head);
  ctx.fillStyle = '#c9ced8';
  ctx.textAlign = 'left';
  fitText(ctx, cfg.match || '', 600, 18 * u, w * 0.6, NUM);
  ctx.fillText(cfg.match || '', x + 14 * u, y + head / 2 + 1 * u);
  const qw = 70 * u;
  ctx.fillStyle = '#f7d54a';
  ctx.fillRect(x + w - qw, y, qw, head);
  ctx.fillStyle = '#111';
  ctx.textAlign = 'center';
  ctx.font = `700 ${22 * u}px ${NUM}`;
  ctx.fillText(quarterLabel(st.q), x + w - qw / 2, y + head / 2 + 1 * u);
  for (let i = 0; i < 2; i++) {
    const c = cfg.teams[i].color, ry = y + head + gap + i * (row + gap);
    const g = ctx.createLinearGradient(0, ry, 0, ry + row);
    g.addColorStop(0, shade(c, 0.08)); g.addColorStop(1, shade(c, -0.15));
    ctx.fillStyle = g; ctx.fillRect(x, ry, w, row);
    const sw = 84 * u, sx = x + w - sw;
    const a = flash(st, i);
    ctx.fillStyle = '#12151c'; ctx.fillRect(sx, ry, sw, row);
    if (a) { ctx.fillStyle = `rgba(247,213,74,${0.25 + 0.5 * a})`; ctx.fillRect(sx, ry, sw, row); }
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = `700 ${48 * u}px ${NUM}`;
    ctx.fillText(String(st.score[i]), sx + sw / 2, ry + row / 2 + 3 * u);
    ctx.textAlign = 'left';
    ctx.fillStyle = teamInk(i);
    fitText(ctx, cfg.teams[i].name, 700, 26 * u, w - sw - 130 * u);
    ctx.fillText(cfg.teams[i].name, x + 16 * u, ry + row / 2 + 1 * u);
    const fw = 90 * u, fx = sx - fw - 14 * u;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    rr(ctx, fx - 6 * u, ry + row / 2 - 4 * u, fw + 12 * u, 20 * u, 4 * u); ctx.fill();
    if (isBonus(st, i)) {
      ctx.fillStyle = '#f7d54a';
      ctx.font = `700 ${12 * u}px ${NUM}`;
      ctx.textAlign = 'right';
      ctx.fillText('BONUS', sx - 14 * u, ry + row / 2 - 10 * u);
    }
    foulDots(ctx, st, i, fx, ry + row / 2 + 4 * u, fw, u, { h: 6 });
    scoreBadge(ctx, st, i, sx + sw - 4 * u, ry + 11 * u, u, 'right', 14);
  }
  ctx.restore();
}

// Rounded translucent pill: names outside, scores inside, period in the middle.
function drawGlass(ctx, W, H, st, u) {
  const w = 640 * u, h = 64 * u;
  const [x, y] = place(W, H, w, h + 14 * u);
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 20 * u; ctx.shadowOffsetY = 6 * u;
  ctx.fillStyle = 'rgba(12,14,20,.78)';
  rr(ctx, x, y, w, h, h / 2); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.2 * u;
  rr(ctx, x, y, w, h, h / 2); ctx.stroke();
  const cx = x + w / 2, cw = 96 * u, sw = 78 * u;
  // centre period chip
  ctx.fillStyle = '#8ff0e0';
  rr(ctx, cx - cw / 2, y + 10 * u, cw, h - 20 * u, (h - 20 * u) / 2); ctx.fill();
  ctx.fillStyle = '#0b1a17';
  ctx.textAlign = 'center';
  ctx.font = `700 ${28 * u}px ${NUM}`;
  ctx.fillText(quarterLabel(st.q), cx, y + h / 2 + 2 * u);
  for (let i = 0; i < 2; i++) {
    const c = cfg.teams[i].color, dir = i === 0 ? -1 : 1;
    const scx = cx + dir * (cw / 2 + sw / 2 + 4 * u);
    const a = flash(st, i);
    if (a) {
      ctx.fillStyle = `rgba(143,240,224,${0.3 * a})`;
      rr(ctx, scx - sw / 2, y + 6 * u, sw, h - 12 * u, 10 * u); ctx.fill();
    }
    ctx.fillStyle = '#fff';
    ctx.font = `700 ${50 * u}px ${NUM}`;
    ctx.textAlign = 'center';
    ctx.fillText(String(st.score[i]), scx, y + h / 2 + 3 * u);
    // name + colour chip
    const nameEdge = scx + dir * (sw / 2 + 10 * u);
    const outer = i === 0 ? x + 28 * u : x + w - 28 * u;
    const avail = Math.abs(nameEdge - outer) - 22 * u;
    ctx.textAlign = i === 0 ? 'left' : 'right';
    fitText(ctx, cfg.teams[i].name, 700, 26 * u, avail);
    ctx.fillStyle = '#fff';
    const tx = i === 0 ? outer + 18 * u : outer - 18 * u;
    ctx.fillText(cfg.teams[i].name, tx, y + h / 2 + 1 * u);
    ctx.fillStyle = c;
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1 * u;
    const chipX = i === 0 ? outer : outer - 10 * u;
    rr(ctx, chipX, y + h / 2 - 12 * u, 10 * u, 24 * u, 3 * u); ctx.fill(); ctx.stroke();
    // fouls under the pill
    const fw = 150 * u;
    const fx = i === 0 ? cx - cw / 2 - fw - 20 * u : cx + cw / 2 + 20 * u;
    foulDots(ctx, st, i, fx, y + h + 6 * u, fw, u, { off: 'rgba(0,0,0,.45)' });
    if (isBonus(st, i)) {
      ctx.fillStyle = '#f7d54a';
      ctx.font = `700 ${14 * u}px ${NUM}`;
      ctx.textAlign = i === 0 ? 'right' : 'left';
      ctx.fillText('BONUS', i === 0 ? fx - 6 * u : fx + fw + 6 * u, y + h + 9 * u);
    }
    scoreBadge(ctx, st, i, scx + 14 * u, y - 2 * u, u);
  }
}

// Original Momentum board (525 px wide reference on a 2000 px frame).
function drawClassic(ctx, W, H, st, s) {
  const pad = 5 * s;
  const w = 525 * s;
  const h1 = 50 * s, h2 = 82 * s, h3 = 22 * s;
  const h = pad + h1 + h2 + pad * 0.6 + h3 + pad;
  const [x, y] = place(W, H, w, h);

  ctx.fillStyle = 'rgba(24,24,24,0.94)';
  ctx.fillRect(x, y, w, h);

  ctx.fillStyle = '#ffffff';
  ctx.font = `900 ${40 * s}px ${FONT}`;
  ctx.textAlign = 'left';
  ctx.fillText(quarterLabel(st.q), x + pad * 1.6, y + pad + h1 / 2 + 2 * s);
  ctx.textAlign = 'right';
  fitText(ctx, cfg.match || '', 900, 40 * s, w * 0.55);
  ctx.fillText(cfg.match || '', x + w - pad * 1.6, y + pad + h1 / 2 + 2 * s);

  const bw = (w - pad * 3) / 2;
  const by = y + pad + h1;
  for (let i = 0; i < 2; i++) {
    const bx = x + pad + i * (bw + pad);
    ctx.fillStyle = cfg.teams[i].color;
    ctx.fillRect(bx, by, bw, h2);
    const a = flash(st, i);
    if (a) { ctx.fillStyle = `rgba(255,255,255,${0.25 * a})`; ctx.fillRect(bx, by, bw, h2); }

    const score = String(st.score[i]);
    ctx.font = `200 ${70 * s}px ${FONT}`;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#8ff0e0';
    const sw = ctx.measureText(score).width;
    ctx.fillText(score, bx + bw - 4 * s, by + h2 / 2 + 3 * s);

    ctx.fillStyle = teamInk(i);
    ctx.textAlign = 'left';
    fitText(ctx, cfg.teams[i].name, 400, 42 * s, bw - sw - 12 * s);
    ctx.fillText(cfg.teams[i].name, bx + 4 * s, by + h2 / 2 + 2 * s);

    const n = foulCount();
    const fy = by + h2 + pad * 0.6;
    const gap = 4 * s;
    const segW = (bw - gap * (n - 1)) / n;
    for (let k = 0; k < n; k++) {
      ctx.fillStyle = k < st.fouls[i] ? '#f2e000' : '#474747';
      ctx.fillRect(bx + k * (segW + gap), fy, segW, h3);
    }
  }
}

// ---------- preview loop ----------
function renderOverlay() {
  if (!video.videoWidth) return;
  if (overlay.width !== video.videoWidth || overlay.height !== video.videoHeight) {
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
  }
  octx.clearRect(0, 0, overlay.width, overlay.height);
  drawBoard(octx, overlay.width, overlay.height, stateAt(video.currentTime));
}
let lastLiveKey = '';
function renderLive() {
  const st = stateAt(video.currentTime);
  const key = JSON.stringify(st) + JSON.stringify(cfg.teams) + cfg.foulSlots;
  if (key !== lastLiveKey) {
    lastLiveKey = key;
    $('#curQuarter').textContent = quarterLabel(st.q);
    $$('.pad').forEach(p => {
      const i = Number(p.dataset.team);
      p.querySelector('.sw').style.background = cfg.teams[i].color;
      p.querySelector('.nm').textContent = cfg.teams[i].name;
      p.querySelector('.sc').textContent = st.score[i];
      const n = Math.max(1, Number(cfg.foulSlots) || 5);
      p.querySelector('.fl').innerHTML = Array.from({ length: n }, (_, k) => `<i class="${k < st.fouls[i] ? 'on' : ''}"></i>`).join('');
    });
  }
  renderOverlay();
}
function tick() {
  if (file) {
    renderLive();
    const d = video.duration || 0;
    $('#timeLabel').textContent = `${fmt(video.currentTime)} / ${fmt(d)}`;
    $('#playhead').style.left = d ? `${video.currentTime / d * 100}%` : '0';
    highlightCurrentRow();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- time formatting ----------
function fmt(t, precise) {
  if (!isFinite(t)) t = 0;
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = t % 60;
  const ss = precise ? sec.toFixed(1).padStart(4, '0') : String(Math.floor(sec)).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}
function parseTime(str) {
  str = String(str || '').trim();
  if (!str) return null;
  const parts = str.split(':').map(Number);
  if (parts.some(isNaN)) return null;
  return parts.reduce((acc, p) => acc * 60 + p, 0);
}

// ---------- event list ----------
const KIND_LABEL = { pts: v => (v > 0 ? `+${v}점` : `${v}점`), foul: v => (v > 0 ? '파울' : '파울 취소'), q: () => '다음 쿼터' };
function renderEvents() {
  const list = sorted();
  $('#evCount').textContent = list.length ? `(${list.length})` : '';
  if (!list.length) { $('#events').innerHTML = '<div class="empty">아직 기록이 없어요</div>'; return; }
  const st = { q: cfg.startQ, score: [0, 0], fouls: [0, 0] };
  const rows = list.map(e => {
    applyEvent(st, e);
    const team = e.kind === 'q' ? '' : `<span class="tag" style="background:${cfg.teams[e.team].color};color:${teamInk(e.team)}">${esc(cfg.teams[e.team].name)}</span>`;
    return `<tr data-id="${e.id}">
      <td><input type="text" class="t" value="${fmt(e.t, true)}"></td>
      <td>${quarterLabel(st.q)}</td>
      <td>${team}</td>
      <td>${KIND_LABEL[e.kind](e.v)}</td>
      <td style="color:var(--accent)">${st.score[0]} : ${st.score[1]}</td>
      <td style="text-align:right"><button data-act="here" title="현재 영상 위치로 옮기기">⌖</button> <button data-act="del" title="삭제">✕</button></td>
    </tr>`;
  });
  $('#events').innerHTML = `<table>${rows.join('')}</table>`;
}
function highlightCurrentRow() {
  const t = video.currentTime;
  let cur = null;
  for (const e of sorted()) { if (e.t <= t) cur = e.id; else break; }
  $$('#events tr').forEach(tr => tr.classList.toggle('cur', Number(tr.dataset.id) === cur));
}
$('#events').addEventListener('click', ev => {
  const tr = ev.target.closest('tr');
  if (!tr) return;
  const e = events.find(x => x.id === Number(tr.dataset.id));
  if (!e) return;
  const act = ev.target.closest('button')?.dataset.act;
  if (act === 'del') { events = events.filter(x => x !== e); changed(); }
  else if (act === 'here') { e.t = video.currentTime; changed(); }
  else if (ev.target.tagName !== 'INPUT') video.currentTime = e.t;
});
$('#events').addEventListener('change', ev => {
  if (!ev.target.matches('input.t')) return;
  const e = events.find(x => x.id === Number(ev.target.closest('tr').dataset.id));
  const t = parseTime(ev.target.value);
  if (e && t != null) e.t = Math.max(0, t);
  changed();
});
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---------- timeline ----------
function renderMarkers() {
  const d = video.duration;
  if (!d) { $('#markers').innerHTML = ''; return; }
  $('#markers').innerHTML = events.map(e => {
    const left = `${e.t / d * 100}%`;
    if (e.kind === 'q') return `<div class="mk q" style="left:${left}"></div>`;
    const color = e.kind === 'foul' ? '#f2e000' : (e.team === 0 ? '#8ff0e0' : '#ff7a7a');
    return `<div class="mk ${e.team === 0 ? 'h' : 'a'} ${e.kind === 'foul' ? 'f' : ''}" style="left:${left};background:${color}"></div>`;
  }).join('');
  const s = cfg.trimStart ?? 0, en = cfg.trimEnd ?? d;
  const box = $('#trimBox');
  box.style.display = (cfg.trimStart != null || cfg.trimEnd != null) ? '' : 'none';
  box.style.left = `${s / d * 100}%`;
  box.style.width = `${Math.max(0, en - s) / d * 100}%`;
}
$('#timeline').addEventListener('click', ev => {
  const r = ev.currentTarget.getBoundingClientRect();
  if (video.duration) video.currentTime = (ev.clientX - r.left) / r.width * video.duration;
});

// ---------- opening files ----------
function openFile(f) {
  if (!f) return;
  file = f;
  $('#fileName').textContent = f.name;
  video.src = URL.createObjectURL(f);
  storeKey = `mm-sb:${f.name}:${f.size}`;
  const saved = lsGet(storeKey);
  events = saved?.events || [];
  if (saved?.cfg) Object.assign(cfg, saved.cfg);
  nextId = events.reduce((m, e) => Math.max(m, e.id), 0) + 1;
  undoStack = [];
  $('#drop').classList.add('hidden');
  $('#editor').classList.remove('hidden');
  $('#exportMsg').textContent = '';
  syncForm();
  changed();
}
// Fit the video inside the space left above the controls, keeping its aspect ratio.
function fitStage() {
  const wrap = $('#stageWrap'), st = $('#stage');
  if (!video.videoWidth || !wrap.clientWidth) return;
  const ar = video.videoWidth / video.videoHeight;
  let w = wrap.clientWidth, h = w / ar;
  if (h > wrap.clientHeight) { h = wrap.clientHeight; w = h * ar; }
  st.style.width = `${Math.floor(w)}px`;
  st.style.height = `${Math.floor(h)}px`;
}
new ResizeObserver(fitStage).observe($('#stageWrap'));
video.addEventListener('loadedmetadata', () => {
  fitStage();
  renderMarkers();
});
video.addEventListener('play', () => { $('#btnPlay').textContent = '❚❚ 일시정지'; });
video.addEventListener('pause', () => { $('#btnPlay').textContent = '▶ 재생'; });

$('#btnOpen').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => openFile(e.target.files[0]);
const drop = $('#drop');
['dragenter', 'dragover'].forEach(n => document.addEventListener(n, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(n => document.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', e => {
  const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('video/') || /\.(mp4|mov|m4v|webm|mkv)$/i.test(f.name));
  if (f) openFile(f);
});

// ---------- controls ----------
function togglePlay() { video.paused ? video.play() : video.pause(); }
$('#btnPlay').onclick = togglePlay;
$$('[data-seek]').forEach(b => b.onclick = () => { video.currentTime = Math.max(0, video.currentTime + Number(b.dataset.seek)); });
$$('#speed button').forEach(b => b.onclick = () => {
  video.playbackRate = Number(b.dataset.rate);
  $$('#speed button').forEach(x => x.classList.toggle('on', x === b));
});
$$('.pad').forEach(p => {
  const team = Number(p.dataset.team);
  p.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { addEvent(b.dataset.add, team, Number(b.dataset.v)); b.blur(); });
});
$('#btnNextQ').onclick = e => { addEvent('q', 0, 1); e.currentTarget.blur(); };
$('#btnUndo').onclick = e => { undo(); e.currentTarget.blur(); };

const KEYMAP = {
  Digit1: ['pts', 0, 1], Digit2: ['pts', 0, 2], Digit3: ['pts', 0, 3], Digit4: ['foul', 0, 1],
  KeyQ: ['pts', 0, -1], KeyR: ['foul', 0, -1],
  Digit7: ['pts', 1, 1], Digit8: ['pts', 1, 2], Digit9: ['pts', 1, 3], Digit0: ['foul', 1, 1],
  KeyU: ['pts', 1, -1], KeyP: ['foul', 1, -1],
  Numpad1: ['pts', 0, 1], Numpad2: ['pts', 0, 2], Numpad3: ['pts', 0, 3], Numpad4: ['foul', 0, 1],
  Numpad7: ['pts', 1, 1], Numpad8: ['pts', 1, 2], Numpad9: ['pts', 1, 3], Numpad0: ['foul', 1, 1],
};
document.addEventListener('keydown', e => {
  if (!file) return;
  if (e.target.matches('input, select, textarea')) return;
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); return; }
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    e.preventDefault();
    const step = (e.shiftKey ? 1 : 5) * (e.code === 'ArrowLeft' ? -1 : 1);
    video.currentTime = Math.max(0, video.currentTime + step);
    return;
  }
  if (e.code === 'KeyN') { addEvent('q', 0, 1); return; }
  const m = KEYMAP[e.code];
  if (m) { e.preventDefault(); addEvent(...m); }
});

// ---------- settings form ----------
function syncForm() {
  for (const i of [0, 1]) {
    $(`#t${i}name`).value = cfg.teams[i].name;
    $(`#t${i}color`).value = cfg.teams[i].color;
    $(`#t${i}text`).value = teamInk(i);
  }
  $('#matchLabel').value = cfg.match;
  $('#startQ').value = cfg.startQ;
  $('#foulSlots').value = cfg.foulSlots;
  $('#lag').value = cfg.lag;
  $('#pos').value = cfg.pos;
  $('#flash').checked = !!cfg.flash;
  renderStyles();
  $('#size').value = cfg.size; $('#sizeVal').textContent = cfg.size;
  $('#trimStart').value = cfg.trimStart != null ? fmt(cfg.trimStart, true) : '';
  $('#trimEnd').value = cfg.trimEnd != null ? fmt(cfg.trimEnd, true) : '';
  $('#quality').value = cfg.quality;
}
function readForm() {
  for (const i of [0, 1]) cfg.teams[i] = { name: $(`#t${i}name`).value, color: $(`#t${i}color`).value, text: $(`#t${i}text`).value };
  cfg.match = $('#matchLabel').value;
  cfg.startQ = Number($('#startQ').value);
  cfg.foulSlots = Math.min(10, Math.max(1, Number($('#foulSlots').value) || 5));
  cfg.lag = Number($('#lag').value) || 0;
  cfg.pos = $('#pos').value;
  cfg.flash = $('#flash').checked;
  cfg.size = Number($('#size').value); $('#sizeVal').textContent = cfg.size;
  cfg.trimStart = parseTime($('#trimStart').value);
  cfg.trimEnd = parseTime($('#trimEnd').value);
  cfg.quality = $('#quality').value;
  changed();
}
$$('.side input, .side select').forEach(el => {
  if (el.id === 'jsonInput') return;
  el.addEventListener(el.type === 'text' ? 'change' : 'input', readForm);
});
$('#btnSwap').onclick = () => {
  cfg.teams.reverse();
  events.forEach(e => { if (e.kind !== 'q') e.team = 1 - e.team; });
  syncForm(); changed();
};
$('#btnTrimStart').onclick = () => { cfg.trimStart = video.currentTime; syncForm(); changed(); };
$('#btnTrimEnd').onclick = () => { cfg.trimEnd = video.currentTime; syncForm(); changed(); };
$('#btnClear').onclick = () => {
  if (events.length && confirm('기록을 모두 지울까요? 되돌릴 수 없어요.')) { events = []; undoStack = []; changed(); }
};
$('#btnSaveJson').onclick = () => {
  const blob = new Blob([JSON.stringify({ version: 1, video: file?.name, cfg, events }, null, 2)], { type: 'application/json' });
  download(blob, (file?.name.replace(/\.[^.]+$/, '') || 'game') + '-scoreboard.json');
};
$('#btnLoadJson').onclick = () => $('#jsonInput').click();
$('#jsonInput').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.events)) throw new Error();
    events = data.events;
    if (data.cfg) Object.assign(cfg, data.cfg);
    nextId = events.reduce((m, x) => Math.max(m, x.id), 0) + 1;
    undoStack = [];
    syncForm(); changed();
  } catch { alert('기록 파일을 읽지 못했어요.'); }
};
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

// ---------- export ----------
let conversion = null;
$('#btnCancel').onclick = () => conversion?.cancel();
$('#btnExport').onclick = async () => {
  if (!file) { showMsg('먼저 영상을 열어 주세요.', true); return; }
  const outName = file.name.replace(/\.[^.]+$/, '') + '-scoreboard.mp4';

  // Ask for the save location first, while we still hold the click's user activation.
  let writable = null;
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: outName, types: [{ description: 'MP4 영상', accept: { 'video/mp4': ['.mp4'] } }] });
      writable = await handle.createWritable();
    } catch (err) {
      if (err.name === 'AbortError') return;
      writable = null;
    }
  }

  video.pause();
  $('#btnExport').disabled = true;
  $('#exportBox').classList.remove('hidden');
  setProgress(0, '준비 중…');
  showMsg('');
  const started = performance.now();
  try {
    const MB = await import(MEDIABUNNY_URL);
    await Promise.all([
      document.fonts.load(`900 40px ${FONT}`, 'A1'),
      document.fonts.load(`700 40px ${NUM}`, '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ+'),
      document.fonts.load(`700 40px ${FONT}`, cfg.teams.map(t => t.name).join('') || '가'),
      document.fonts.load(`400 40px ${FONT}`, cfg.teams.map(t => t.name).join('') || '가'),
      document.fonts.load(`200 40px ${FONT}`, '0123456789'),
    ]);

    const input = new MB.Input({ source: new MB.BlobSource(file), formats: MB.ALL_FORMATS });
    const vt = await input.getPrimaryVideoTrack();
    if (!vt) throw new Error('영상 트랙을 찾지 못했어요.');
    const W = vt.displayWidth & ~1, H = vt.displayHeight & ~1;
    const codec = await MB.getFirstEncodableVideoCodec(['avc', 'hevc', 'vp9', 'av1'], { width: W, height: H });
    if (!codec) throw new Error('이 브라우저에서는 영상 인코딩을 지원하지 않아요. 최신 크롬이나 엣지를 사용해 주세요.');

    const target = writable ? new MB.StreamTarget(writable, { chunked: true }) : new MB.BufferTarget();
    const output = new MB.Output({ format: new MB.Mp4OutputFormat({ fastStart: writable ? false : 'in-memory' }), target });

    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const t0 = await vt.getFirstTimestamp();
    const quality = { medium: MB.QUALITY_MEDIUM, high: MB.QUALITY_HIGH, very_high: MB.QUALITY_VERY_HIGH }[cfg.quality] || MB.QUALITY_HIGH;
    // Output timestamps start at 0 at trim.start, so map them back by adding the trim offset.
    const trimOffset = cfg.trimStart ?? 0;
    const trim = { start: trimOffset + t0 };
    if (cfg.trimEnd != null) trim.end = cfg.trimEnd + t0;

    conversion = await MB.Conversion.init({
      input, output,
      trim,
      video: {
        codec,
        bitrate: quality,
        forceTranscode: true,
        processedWidth: W,
        processedHeight: H,
        process: sample => {
          sample.draw(ctx, 0, 0, W, H);
          drawBoard(ctx, W, H, stateAt(sample.timestamp + trimOffset));
          return canvas;
        },
      },
    });
    if (!conversion.isValid) {
      throw new Error('이 영상 형식은 변환할 수 없어요: ' + conversion.discardedTracks.map(d => `${d.track.type} (${d.reason})`).join(', '));
    }
    conversion.onProgress = p => {
      const el = (performance.now() - started) / 1000;
      const eta = p > 0.02 ? el / p - el : null;
      setProgress(p, `${Math.round(p * 100)}%` + (eta != null ? ` · 약 ${fmt(eta)} 남음` : ''));
    };
    await conversion.execute();

    if (!writable) download(new Blob([target.buffer], { type: 'video/mp4' }), outName);
    setProgress(1, '완료');
    showMsg(`내보내기 완료 (${fmt((performance.now() - started) / 1000)} 걸림). ${writable ? '저장한 위치에서 파일을 확인하세요.' : '다운로드 폴더를 확인하세요.'}`);
  } catch (err) {
    if (conversion?.state === 'canceled') showMsg('내보내기를 취소했어요.');
    else { console.error(err); showMsg('내보내기에 실패했어요: ' + (err?.message || err), true); }
    try { await writable?.abort(); } catch {}
  } finally {
    conversion = null;
    $('#btnExport').disabled = false;
    setTimeout(() => $('#exportBox').classList.add('hidden'), 1500);
  }
};
function setProgress(p, label) { $('#exportBar').style.width = `${Math.round(p * 100)}%`; $('#exportLabel').textContent = label; }
function showMsg(text, err) { const m = $('#exportMsg'); m.textContent = text; m.classList.toggle('err', !!err); }

// ---------- style picker ----------
// Size (%) that makes each style fill ~90% of its thumbnail.
const THUMB_SIZE = { bar: 90 * 440 / 608, stack: 62, glass: 90 * 450 / 640, classic: 72 };
function renderStyles() {
  const box = $('#styles');
  if (!box.children.length) {
    box.innerHTML = Object.entries(STYLES).map(([k, v]) => `<button data-style="${k}"><canvas width="640" height="280"></canvas>${v.label}</button>`).join('');
    box.onclick = e => {
      const b = e.target.closest('[data-style]');
      if (!b) return;
      cfg.style = b.dataset.style;
      renderStyles(); changed();
    };
  }
  const demo = { t: 10, q: 3, score: [52, 48], fouls: [2, 5], last: [{ t: 9.6, v: 3 }, null] };
  const saved = { pos: cfg.pos, size: cfg.size, style: cfg.style };
  box.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.style === cfg.style);
    const c = b.querySelector('canvas'), x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, c.height);
    g.addColorStop(0, '#c9b49a'); g.addColorStop(1, '#8a6d4c');
    x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
    Object.assign(cfg, { style: b.dataset.style, pos: 'tc', size: THUMB_SIZE[b.dataset.style] });
    drawBoard(x, c.width, c.height, demo);
    Object.assign(cfg, saved);
  });
}
document.fonts.ready.then(() => renderStyles());

syncForm();
renderEvents();
</script>
