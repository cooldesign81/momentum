img{max-width:100%}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.en{font-family:"Anton","Black Han Sans",Impact,sans-serif;font-weight:400;letter-spacing:.01em}
.ko{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400}
.num{font-variant-numeric:tabular-nums}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
.hero .wrap{padding-top:28px;padding-bottom:26px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;position:relative;z-index:1}
.hero .mark{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit}
.hero .logo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.12)}
.hero h1{margin:0;font-size:clamp(3rem,11vw,6.2rem);line-height:.9}
.hero .slogan{margin:10px 0 0;font-size:1.05rem;opacity:.85}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28}
.hero .season-tag{font-size:.9rem;opacity:.8;white-space:nowrap}

/* nav */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.nav{display:flex;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:1 0 auto;text-align:center;padding:14px 16px 11px;color:var(--muted);text-decoration:none;font-weight:700;font-size:.95rem;border-bottom:3px solid transparent;white-space:nowrap}
.nav a{text-transform:uppercase;letter-spacing:.025em;font-size:.93rem;font-weight:800}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-bottom:72px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 18px}
.page-head h2{margin:0;font-size:2rem;line-height:1.1}
.sec{margin-top:36px}
.sec>h3,.sec-head h3{margin:0 0 12px;font-size:1.1rem}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h3{margin:0}
.more{color:var(--brand);text-decoration:none;font-weight:700;font-size:.92rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;margin:0}
.muted{color:var(--muted)}
select.season{padding:8px 34px 8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.9rem;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);box-shadow:inset 0 -3px 0 var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}

/* standings */
.stand{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.team{padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.team .rank{grid-row:1/3;font-size:2.6rem;line-height:1;color:var(--brand)}
.team .nm{font-weight:700;font-size:1.1rem}
.team .wl{color:var(--muted);font-size:.92rem}
.team.first{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.team.first .rank{color:var(--gold)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:10px 12px;text-align:right;white-space:nowrap}
th{font-size:.8rem;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);background:var(--surface)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
th.sortable{cursor:pointer;user-select:none}
th.sorted{color:var(--brand)}
td a{color:inherit;text-decoration:none;font-weight:700}
td a:hover{text-decoration:underline}
.sticky-col{position:sticky;left:0;background:var(--surface);z-index:1}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.game{padding:14px 16px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.game:hover{border-color:var(--brand)}
.game .meta{font-size:.8rem;color:var(--muted);margin-bottom:6px}
.game .row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.game .row .t{font-weight:500}
.game .row .s{font-size:1.5rem;line-height:1.1}
.game .row.win .t{font-weight:700}
.game .row.lose .s{color:var(--muted)}
.game .hint{font-size:.78rem;color:var(--brand);margin-top:6px;font-weight:700}
details.week{margin-bottom:10px}
details.week summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;justify-content:space-between;gap:10px;font-weight:700}
details.week summary::-webkit-details-marker{display:none}
details.week summary::after{content:"+";color:var(--muted);font-weight:400}
details.week[open] summary::after{content:"−"}
details.week .games{padding:0 14px 14px}

/* MVP race */
.race{padding:8px 18px}
.race-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.race-row:last-child{border-bottom:0}
.race-row .r{color:var(--muted);font-weight:700;text-align:center}
.race-row:first-child .r{color:var(--gold)}
.race-row .bar{height:6px;border-radius:3px;background:var(--brand-soft);margin-top:4px;overflow:hidden}
.race-row .bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.race-row:first-child .bar i{background:var(--gold)}
.race-row a{color:inherit;text-decoration:none;font-weight:700}
.race-row .v{font-size:1.4rem}
.two{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:820px){.two{grid-template-columns:1.2fr 1fr}}

/* players */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pcard{overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.pcard:hover{border-color:var(--brand)}
.ph{aspect-ratio:4/5;background:var(--brand-soft);position:relative;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ph .ini{font-size:3.4rem;color:var(--brand)}
.ph .no{position:absolute;right:10px;top:6px;font-size:2rem;color:var(--brand);line-height:1}
.ph img+.no,.ph .no.onimg{color:#6A4FC0;text-shadow:0 2px 4px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.35)}
.pcard .b{padding:10px 12px 12px}
.pcard h4{margin:0;font-size:1.05rem}
.pcard .prof{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.pcard .line{display:flex;gap:10px;margin-top:8px;font-size:.8rem;color:var(--muted)}
.pcard .line b{display:block;font-size:1.05rem;color:var(--ink)}
.team-block{margin-top:30px}
.team-block h3{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.team-block h3 small{color:var(--muted);font-weight:500;font-size:.85rem}

/* player detail */
.pd{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:center;margin-top:30px}
.pd .ph{border-radius:18px;overflow:hidden}
.pd h2{margin:0;font-size:2.4rem;line-height:1.05}
.pd .no{font-size:1.4rem;color:var(--brand)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.facts span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.88rem}
.big4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.big4 div{padding:12px 14px}
.big4 b{display:block;font-size:2rem;line-height:1.1}
.big4 span{font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.pd{grid-template-columns:96px 1fr}.pd h2{font-size:1.8rem}.big4{grid-template-columns:repeat(2,1fr)}}
.back{display:inline-block;margin-top:24px;color:var(--muted);text-decoration:none;font-weight:500}
.wl-W{color:var(--brand);font-weight:700}
.wl-L{color:var(--muted)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px}
.cal-head h3{margin:0;font-size:1.4rem;min-width:7.5em;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--line);gap:1px;margin-top:14px}
.cal .dow{background:var(--surface);text-align:center;font-size:.8rem;font-weight:700;color:var(--muted);padding:8px 0}
.cal .dow:first-child{color:#D14343}.cal .dow:last-child{color:#3B6FD1}
.cal .day{background:var(--surface);min-height:88px;padding:6px;font-size:.85rem}
.cal .day.out{background:var(--bg);color:var(--muted)}
.cal .day.today .d{background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 7px}
.cal .ev{display:block;margin-top:4px;font-size:.74rem;line-height:1.3;padding:3px 6px;border-radius:6px;background:var(--brand-soft);color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;width:100%;text-align:left;cursor:pointer}
.cal .ev.league{background:var(--brand);color:var(--brand-ink)}
@media (max-width:560px){.cal .day{min-height:62px;padding:4px}.cal .ev{font-size:0;height:6px;padding:0;margin-top:3px}}
.evlist{display:grid;gap:10px;margin-top:18px}
.evitem{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:12px 16px;align-items:center}
.evitem .dd{text-align:center;line-height:1.1}
.evitem .dd b{display:block;font-size:1.7rem}
.evitem .dd span{font-size:.78rem;color:var(--muted)}
.evitem h4{margin:0;font-size:1rem}
.evitem p{margin:2px 0 0;font-size:.88rem;color:var(--muted)}

/* watch */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.video{overflow:hidden}
.video .frame{aspect-ratio:16/9;background:#000;position:relative}
.video .frame img,.video .frame iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.video .frame button{position:absolute;inset:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.video .frame button span{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:1.4rem}
.video .b{padding:12px 14px}
.video h4{margin:0;font-size:1rem}
.video p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(12,8,20,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:900px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet .x{float:right}
.score-line{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0 20px;text-align:center}
.score-line .tm{font-weight:700;font-size:1.05rem;min-width:5em}
.score-line .sc{font-size:3rem;line-height:1}
.score-line .sc.lose{color:var(--muted)}
.box-title{margin:18px 0 8px;font-size:1rem}

.status{font-size:.8rem;color:var(--muted);margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.loading img{display:block;width:84px;margin:0 auto 14px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){.loading img{animation:none}}

html,body{overflow-x:clip}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.link-btn{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:4px 0;font-size:.88rem}
.link-btn.danger,.danger{color:#C62828}
.mini-actions{display:flex;gap:14px;margin-top:6px}
.big-h{font-size:1.9rem;letter-spacing:.02em;line-height:1}
.sec-head .big-h{margin:0}

/* forms */
.form h3{margin:0 0 14px;font-size:1.25rem}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:.88rem;font-weight:700;margin-bottom:4px}
.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field textarea{min-height:110px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.actions{display:flex;gap:8px;align-items:center;margin-top:6px}
.err{color:#C62828;font-size:.9rem;min-height:1.2em;margin:0 0 4px}
.modal .sheet:has(.form){max-width:480px}

/* home */
.home-grid{display:grid;gap:10px}
@media(min-width:820px){.home-grid{grid-template-columns:1.3fr 1fr;gap:32px;align-items:start}}
.news-list{display:grid;gap:10px;margin-top:12px}
.news{padding:14px 18px}
.news.pinned{border-left:4px solid var(--accent)}
.news-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.news h4{margin:0;font-size:1.02rem}
.news time{font-size:.8rem;color:var(--muted);white-space:nowrap}
.news p{margin:6px 0 0;white-space:pre-wrap;font-size:.95rem}
.pin{display:inline-block;background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:8px;vertical-align:2px}
.about .about-body{font-size:1.05rem;line-height:1.85;max-width:42em;margin-top:12px}
.evitem{grid-template-columns:72px 1fr auto}

/* league — the loud page */
.bleed{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
.lg-hero{color:#fff;padding:34px 0 30px;margin-top:0;
  background:
   radial-gradient(circle at 88% 115%,rgba(0,161,233,.38),transparent 45%),
   radial-gradient(circle at 8% -20%,rgba(140,120,230,.45),transparent 50%),
   linear-gradient(160deg,#22174A 0%,#553E96 55%,#170F33 100%);
  position:relative;overflow:hidden}
.lg-hero::before{content:"";position:absolute;right:-120px;top:50%;width:420px;height:420px;border:2px solid rgba(111,208,255,.12);border-radius:50%;transform:translateY(-50%)}
.lg-emblem{position:absolute;right:4%;top:50%;transform:translateY(-50%);height:118%;max-height:520px;opacity:.09;pointer-events:none;z-index:0}
.lg-hero::after{content:"";position:absolute;right:90px;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.06)}
.lg-hero .wrap{position:relative;z-index:1}
.lg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.eyebrow{margin:0;font-weight:700;letter-spacing:.2em;font-size:.78rem;color:#6FD0FF;display:flex;align-items:center;gap:8px}
.eyebrow img{width:22px;height:22px}
.lg-title{margin:4px 0 0;font-size:clamp(3.2rem,12vw,6.5rem);line-height:.9}
.lg-hero select.season{background-color:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.lg-hero select.season option{color:#000}
.podium{display:grid;gap:12px;margin-top:26px;grid-template-columns:1fr}
@media(min-width:720px){.podium{grid-template-columns:1.35fr 1fr 1fr;align-items:end}}
.pod{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px 18px;backdrop-filter:blur(4px)}
.pod-1{background:linear-gradient(145deg,#FFD66B,#F2A516 60%,#D98200);color:#241400;border:0;box-shadow:0 14px 40px rgba(242,165,22,.35);padding:22px 22px}
.pod-rank{font-size:2.6rem;line-height:1}
.pod-rank small{font-size:1rem;margin-left:2px;vertical-align:top}
.pod-1 .pod-rank{font-size:3.6rem}
.pod-team{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:1.6rem;margin-top:6px}
.pod-1 .pod-team{font-size:2.2rem}
.pod-wl{font-size:1.9rem;margin-top:4px}
.pod-wl span{font-size:.9rem;opacity:.7;margin-right:6px}
.pod-bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:10px;overflow:hidden}
.pod-bar i{display:block;height:100%;background:#fff;border-radius:3px}
.pod-1 .pod-bar{background:rgba(36,20,0,.18)}.pod-1 .pod-bar i{background:#241400}
.pod-meta{font-size:.85rem;opacity:.8;margin-top:8px}
.mvp-wrap{display:grid;gap:14px;margin-top:14px;align-items:start}
@media(min-width:820px){.mvp-wrap{grid-template-columns:1fr 1fr}}
.king{display:grid;grid-template-columns:130px 1fr;gap:18px;padding:20px;border-radius:20px;text-decoration:none;color:#fff;
  background:linear-gradient(150deg,#170F33,#553E96);position:relative;overflow:hidden;box-shadow:0 12px 34px rgba(85,62,150,.35);border-bottom:3px solid var(--accent)}
.king::after{content:"MVP";position:absolute;right:-10px;bottom:-30px;font-family:Anton,Impact,sans-serif;font-size:9rem;color:rgba(255,255,255,.06);line-height:1}
.king-ph{aspect-ratio:4/5;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;overflow:hidden;border:2px solid #FFC857}
.king-ph img{width:100%;height:100%;object-fit:cover}
.king-ph span{font-size:2.8rem;color:#FFC857}
.crown{display:inline-block;background:#FFC857;color:#241400;font-weight:700;font-size:.78rem;border-radius:999px;padding:2px 10px}
.king-name{font-size:2.2rem;line-height:1.1;margin-top:8px}
.king-team{opacity:.7;font-size:.9rem}
.king-score{font-size:3.6rem;line-height:1;color:#FFC857;margin-top:6px}
.king-stats{display:flex;gap:16px;margin-top:8px;font-size:.78rem;opacity:.85}
.king-stats b{display:block;font-size:1.1rem}
@media(max-width:480px){.king{grid-template-columns:96px 1fr;gap:14px;padding:16px}.king-name{font-size:1.7rem}.king-score{font-size:2.8rem}}
.wmvp{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;margin-top:12px}
.wm{flex:0 0 auto;min-width:108px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px}
.wm .wk{font-size:1.3rem;color:var(--brand);line-height:1}
.wm b{font-size:1rem}
.wm .num{font-size:.82rem;color:var(--muted)}
.wm.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.wm.on .wk,.wm.on .num{color:inherit;opacity:.85}
.wk-chips{margin-top:12px}
.sbs{display:grid;gap:14px;margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.sb{all:unset;cursor:pointer;display:block;border-radius:18px;padding:14px 18px 12px;color:#fff;background:linear-gradient(170deg,#241A45,#130D26);border-top:3px solid var(--accent) !important;box-shadow:0 8px 24px rgba(18,10,30,.25);border:1px solid rgba(255,255,255,.06);transition:transform .15s}
.sb:hover{transform:translateY(-2px)}
.sb:focus-visible{outline:3px solid var(--accent)}
.sb-top{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.14em;color:#6FD0FF;font-weight:700;margin-bottom:6px}
.sb-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.sb-row .tn{font-size:1.1rem;font-weight:700}
.sb-row .sc{font-size:2.6rem;line-height:1.05}
.sb-row.l{opacity:.45}
.sb-row.w .sc{color:#fff}
.sb-foot{border-top:1px solid rgba(255,255,255,.1);margin-top:8px;padding-top:8px;font-size:.82rem;opacity:.85;display:flex;gap:4px;align-items:baseline}
.sb-foot .go{margin-left:auto;color:#6FD0FF;font-weight:700}

/* watch */
.channel{overflow:hidden;margin-bottom:10px}
.channel .frame{aspect-ratio:16/9;background:#000}
.channel iframe{width:100%;height:100%;border:0;display:block}
.channel .b{padding:12px 16px}
.channel h4{margin:0}
.channel p{margin:2px 0 0;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.sb{transition:none}}
.mvp-wrap .race-row:first-child .r{color:var(--muted)}.mvp-wrap .race-row:first-child .bar i{background:var(--brand)}
.stand p a{color:inherit;text-decoration:none;font-weight:500}.stand p a:hover{text-decoration:underline}

/* watch categories */

<script>
/* ===================== 데이터 불러오기 ===================== */
const EMBLEM = (() => { try { return JSON.parse(document.getElementById('emblem-data').textContent); } catch (e) { return {}; } })();
const SNAP = JSON.parse(document.getElementById('snapshot').textContent);
const SNAP_DATE = '2026년 9월 23일';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const str = v => (v === null || v === undefined) ? '' : String(v).trim();
const num = v => { if (v === null || v === undefined || v === '') return 0; const n = Number(String(v).replace(/[%,]/g, '')); return isFinite(n) ? n : 0; };
const isGuest = n => /guest|게스트/i.test(n);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const WD = '일월화수목금토';
function normDate(v) {
  const m = str(v).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : '';
}
function fmtDate(s, withDow = true) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  return `${m}월 ${d}일` + (withDow ? ` (${WD[new Date(y, m - 1, d).getDay()]})` : '');
}

const COLS = { pts: 1, fgm: 2, fga: 3, tpm: 5, tpa: 6, ftm: 8, fta: 9, reb: 11, ast: 12, to: 13, stl: 14, blk: 15, oreb: 16, dreb: 17, pf: 18 };
const KEYS = Object.keys(COLS);

// Week 시트 한 장(2차원 배열) → 경기 3개
function parseWeek(g, weekNo, seasonId) {
  const cell = (r, c) => (g[r] || [])[c];
  const date = normDate(cell(0, 20));
  const games = [];
  [0, 22, 44].forEach((base, bi) => {
    const teamA = str(cell(base + 2, 0)), teamB = str(cell(base + 2, 20));
    if (!teamA || !teamB) return;
    const side = off => {
      const rows = [];
      for (let r = base + 4; r <= base + 18; r++) {
        const name = str(cell(r, off));
        if (!name || name === 'PLAYER') continue;
        const p = { name };
        KEYS.forEach(k => p[k] = num(cell(r, off + COLS[k])));
        rows.push(p);
      }
      return rows;
    };
    const a = side(0), b = side(20);
    if (!a.length && !b.length) return;
    const m = str(cell(base + 1, 0)).match(/(\d+)\s*:\s*(\d+)/);
    const sa = m ? +m[1] : a.reduce((s, p) => s + p.pts, 0);
    const sb = m ? +m[2] : b.reduce((s, p) => s + p.pts, 0);
    games.push({ id: `${seasonId}-w${weekNo}-${bi}`, seasonId, week: weekNo, date, label: str(cell(base, 0)).replace(/\s*MATCH/i, ''), teamA, teamB, scoreA: sa, scoreB: sb, a, b });
  });
  return games;
}
// LISTS 시트 → 팀 이름과 로스터
function parseLists(g) {
  const cell = (r, c) => (g[r] || [])[c];
  const teams = [], rosters = {};
  [3, 4, 5].forEach((c, i) => {
    const t = str(cell(2, c)) || str(cell(1 + i, 1));
    if (!t) return;
    teams.push(t);
    rosters[t] = [];
    for (let r = 3; r < 44; r++) { const n = str(cell(r, c)); if (n && !isGuest(n)) rosters[t].push(n); }
  });
  return { teams, rosters };
}

// 간단한 CSV 파서
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.map(r => r.map(v => v === '' ? null : v));
}
async function fetchSheet(id, sheet, range) {
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(sheet)}&range=${range}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const t = await res.text();
  if (/^\s*</.test(t)) throw new Error('공유 안 됨');
  return parseCSV(t);
}
function planOf(g) {
  const cell = (r, c) => (g[r] || [])[c];
  const date = normDate(cell(0, 20));
  const matchups = [0, 22, 44].map(b => [str(cell(b + 2, 0)), str(cell(b + 2, 20))]).filter(m => m[0] && m[1]);
  return { date, matchups };
}
function buildSeason(s, lists, weekGrids) {
  Object.assign(s, parseLists(lists));
  s.games = []; s.plan = {};
  Object.entries(weekGrids).forEach(([w, g]) => { if (!g) return; s.games.push(...parseWeek(g, +w, s.id)); s.plan[w] = planOf(g); });
}
async function loadSeason(cfg) {
  const s = { ...cfg, games: [], teams: [], rosters: {}, plan: {}, source: '' };
  const fromSnap = () => {
    const snap = SNAP[cfg.snapKey || cfg.id];
    if (!snap) return false;
    const grids = {}; Object.keys(snap.weeks).forEach(w => grids[parseInt(w.replace(/\D/g, ''), 10)] = snap.weeks[w]);
    buildSeason(s, snap.lists, grids);
    s.source = cfg.frozen ? 'archive' : 'snapshot';
    return true;
  };
  if (cfg.frozen && fromSnap()) { /* 끝난 시즌: 저장된 기록 사용 */ }
  else {
    try {
      const lists = await fetchSheet(cfg.sheetId, 'LISTS', 'A1:F44');
      const weeks = await Promise.all(Array.from({ length: cfg.weeks || 12 }, (_, i) =>
        fetchSheet(cfg.sheetId, 'Week ' + pad(i + 1), 'A1:AM64').catch(() => null)));
      const grids = {}; weeks.forEach((g, i) => grids[i + 1] = g);
      buildSeason(s, lists, grids);
      if (!s.teams.length) throw new Error('빈 데이터');
      s.source = 'live';
    } catch (e) {
      if (!fromSnap()) { s.source = 'none'; return s; }
    }
  }
  return finalizeSeason(s);
}
function finalizeSeason(s) {
  s.games.sort((x, y) => x.week - y.week);
  s.weekDates = {};
  Object.entries(s.plan).forEach(([w, p]) => { if (p.date) s.weekDates[w] = p.date; });
  s.games.forEach(g => { if (g.date) s.weekDates[g.week] = g.date; });
  s.games.forEach(g => { if (!g.date) g.date = s.weekDates[g.week] || ''; });
  s.stats = aggregate(s.games);
  s.standings = standings(s);
  return s;
}

// 기록 보관소 시트(Apps Script가 매일 백업) → 지난 시즌들
async function loadArchive(id) {
  const [seas, ros, rows] = await Promise.all([fetchSheet(id, 'SEASONS', 'A1:F300'), fetchSheet(id, 'ROSTERS', 'A1:C5000'), fetchSheet(id, 'GAMES', 'A1:Y30000')]);
  const out = {};
  seas.slice(1).forEach(r => { const k = str(r[0]); if (!k) return; out[k] = { id: 'arch' + Object.keys(out).length, key: k, teams: str(r[3]).split('|').filter(Boolean), rosters: {}, games: [], plan: {}, source: 'archive' }; });
  ros.slice(1).forEach(r => { const s = out[str(r[0])]; if (!s) return; const t = str(r[1]), n = str(r[2]); if (!t || !n || isGuest(n)) return; (s.rosters[t] = s.rosters[t] || []).push(n); if (!s.teams.includes(t)) s.teams.push(t); });
  const gm = {};
  rows.slice(1).forEach(r => {
    const s = out[str(r[0])]; if (!s) return;
    const week = num(r[1]), gid = `${s.id}-w${week}-${str(r[3])}`;
    let g = gm[gid];
    if (!g) { g = gm[gid] = { id: gid, seasonId: s.id, week, date: str(r[2]), label: str(r[3]), teamA: '', teamB: '', scoreA: 0, scoreB: 0, a: [], b: [] }; s.games.push(g); }
    const side = str(r[4]) === 'B' ? 'b' : 'a';
    if (side === 'a') { g.teamA = str(r[5]); g.teamB = g.teamB || str(r[6]); g.scoreA = num(r[7]); g.scoreB = num(r[8]); }
    else { g.teamB = str(r[5]); g.teamA = g.teamA || str(r[6]); g.scoreB = num(r[7]); g.scoreA = num(r[8]); }
    const p = { name: str(r[9]) }; KEYS.forEach((k, i) => p[k] = num(r[10 + i]));
    g[side].push(p);
  });
  return Object.values(out).map(finalizeSeason);
}
const startOf = s => Object.values(s.weekDates || {}).sort()[0] || '';
async function loadAllSeasons() {
  const L = CONFIG.league;
  const [cur, frozen, arch] = await Promise.all([
    loadSeason({ id: 'current', sheetId: L.sheetId, weeks: 12, snapKey: L.currentSnapshot }),
    Promise.all(L.savedSeasons.map(id => loadSeason({ id, frozen: true }))),
    L.archiveSheetId ? loadArchive(L.archiveSheetId).catch(e => { console.warn('보관소를 읽지 못했어요', e); return []; }) : [],
  ]);
  // 같은 시즌(시작 날짜가 같음)이 여러 곳에 있으면: 현재 시트 > 보관소 > 사이트 저장본
  const byStart = new Map();
  [...frozen, ...arch, cur].forEach(s => { if (s.source === 'none' || !s.teams.length) return; byStart.set(startOf(s) || 'zz-current', s); });
  const list = [...byStart.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(e => e[1]);
  list.forEach((s, i) => {
    const id = 's' + (i + 1);
    s.name = `시즌 ${i + 1}`;
    s.games.forEach(g => { g.id = g.id.replace(/^[^-]+/, id); g.seasonId = id; });
    s.id = id;
    s.isCurrent = s === cur;
  });
  return list.reverse();
}

/* ===================== 계산 ===================== */
function aggregate(games) {
  const m = new Map();
  for (const g of games) for (const [side, team, opp, won] of [[g.a, g.teamA, g.teamB, g.scoreA > g.scoreB], [g.b, g.teamB, g.teamA, g.scoreB > g.scoreA]]) {
    for (const p of side) {
      if (isGuest(p.name)) continue;
      let t = m.get(p.name);
      if (!t) { t = { name: p.name, gp: 0, team, log: [] }; KEYS.forEach(k => t[k] = 0); m.set(p.name, t); }
      t.gp++; t.team = team;
      KEYS.forEach(k => t[k] += p[k]);
      t.log.push({ ...p, game: g, team, opp, won });
    }
  }
  return [...m.values()].map(finish);
}
function finish(t) {
  const a = { ...t, avg: {} };
  KEYS.forEach(k => a.avg[k] = t.gp ? t[k] / t.gp : 0);
  // 기록 시트와 같은 방식: 항목별 평균을 소수 첫째 자리로 반올림한 뒤 더함
  const r = k => Math.round(a.avg[k] * 10) / 10;
  a.avg.mvp = Math.round((r('pts') + r('reb') + r('ast') + r('stl') + r('blk') - r('to')) * 10) / 10;
  a.avg.eff = Math.round((a.avg.mvp - (r('fga') - r('fgm')) - (r('fta') - r('ftm'))) * 10) / 10;
  a.avg.fgp = t.fga ? t.fgm / t.fga * 100 : null;
  a.avg.tpp = t.tpa ? t.tpm / t.tpa * 100 : null;
  a.avg.ftp = t.fta ? t.ftm / t.fta * 100 : null;
  return a;
}
function careerStats() {
  const m = new Map();
  for (const s of state.seasons) for (const p of s.stats) {
    let t = m.get(p.name);
    if (!t) { t = { name: p.name, gp: 0, team: '', log: [], seasons: 0 }; KEYS.forEach(k => t[k] = 0); m.set(p.name, t); }
    t.gp += p.gp; t.seasons++; KEYS.forEach(k => t[k] += p[k]); t.log.push(...p.log);
  }
  return [...m.values()].map(finish);
}
function standings(s) {
  const t = {};
  const get = n => t[n] || (t[n] = { team: n, w: 0, l: 0, pf: 0, pa: 0, gp: 0 });
  s.teams.forEach(get);
  for (const g of s.games) {
    const A = get(g.teamA), B = get(g.teamB);
    A.gp++; B.gp++; A.pf += g.scoreA; A.pa += g.scoreB; B.pf += g.scoreB; B.pa += g.scoreA;
    if (g.scoreA > g.scoreB) { A.w++; B.l++; } else if (g.scoreB > g.scoreA) { B.w++; A.l++; }
  }
  return Object.values(t).sort((x, y) => (y.w / (y.gp || 1)) - (x.w / (x.gp || 1)) || (y.pf - y.pa) - (x.pf - x.pa));
}
function eligible(list) {
  const max = Math.max(0, ...list.map(p => p.gp));
  return max >= 6 ? list.filter(p => p.gp >= 6) : list;
}
function leaders(list, k, n = 10) {
  return eligible(list).filter(p => p.avg[k] !== null && (k !== 'fgp' || p.fga >= 10))
    .sort((a, b) => b.avg[k] - a.avg[k]).slice(0, n);
}
function weeklyMVP(s) {
  const weeks = [...new Set(s.games.map(g => g.week))];
  return weeks.map(w => {
    const tot = {};
    s.games.filter(g => g.week === w).forEach(g => [...g.a, ...g.b].forEach(p => {
      if (isGuest(p.name)) return;
      tot[p.name] = (tot[p.name] || 0) + p.pts + p.reb + p.ast + p.stl + p.blk - p.to;
    }));
    const best = Object.entries(tot).sort((a, b) => b[1] - a[1])[0];
    return best ? { week: w, date: s.weekDates[w], name: best[0], score: best[1] } : null;
  }).filter(Boolean);
}

function parseDateText(s) {

  else if (dg.length === 8 && dg === s) [y, m, d] = [dg.slice(0, 4), dg.slice(4, 6), dg.slice(6)];
  else if (dg.length === 6 && dg === s) [y, m, d] = [dg.slice(0, 2), dg.slice(2, 4), dg.slice(4)];

  y = +y < 100 ? 2000 + +y : +y; m = +m; d = +d;

}

  const iso = parseDateText(s);

  const [y, m, d] = iso.split('-').map(Number);

}

/* ===================== 일정 ===================== */
function allEvents() {
  const ev = [];
  // 리그 일정에 붙인 시간·장소·메모 (일정 비번으로 수정)
  const notes = {}; state.events.filter(e => e.leagueDate).forEach(e => notes[e.leagueDate] = e);
  for (const s of state.seasons) for (const [w, d] of Object.entries(s.weekDates || {})) {
    const played = s.games.filter(g => g.week === +w);
    const matchups = played.length ? played.map(g => `${g.teamA} ${g.scoreA}:${g.scoreB} ${g.teamB}`).join(', ')
      : (s.plan[w]?.matchups || []).map(m => `${m[0]} vs ${m[1]}`).join(', ');
    const n = notes[d] || {};
    ev.push({ date: d, time: n.time || '', place: n.place || '', memo: n.memo || '', uniforms: n.uniforms || {}, noteId: n.id, matchups,
      title: `${s.name} ${w}주차 리그전`, league: true, season: s.id, week: +w,
      sub: [n.time, n.place].filter(Boolean).join(', ') || matchups });
  }
  state.events.filter(e => !e.leagueDate).forEach(e => ev.push({ ...e, sub: [e.time, e.place].filter(Boolean).join(', ') }));
  return ev.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
}
function uniChips(u) {

}
const uniformOf = (date, team) => ((state.events.find(e => e.leagueDate === date) || {}).uniforms || {})[team] || '';
const uniDot = (date, team) => { const c = uniformOf(date, team); return c ? `<i class="uni-dot u-${c}" title="${uniLabel(c)} 유니폼"></i>` : ''; };
const PIN = '<svg class="pin-ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>';

function pageSchedule() {
  const evs = allEvents();
  if (!state.calMonth) state.calMonth = ymd(new Date()).slice(0, 7);
  const [y, m] = state.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), start = new Date(y, m - 1, 1 - first.getDay());
  const today = ymd(new Date());
  const byDate = {}; evs.forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));
  let cells = WD.split('').map(w => `<div class="dow">${w}</div>`).join('');
  const weeksNeeded = Math.ceil((first.getDay() + new Date(y, m, 0).getDate()) / 7);
  for (let i = 0; i < weeksNeeded * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = ymd(d), out = d.getMonth() !== m - 1;
    cells += `<div class="day ${out ? 'out' : ''} ${k === today ? 'today' : ''}"><span class="d">${d.getDate()}</span>${(byDate[k] || []).map(e =>
      e.league ? `<a class="ev league" href="#/league" data-goweek="${e.season}:${e.week}" title="${esc([e.title, e.time, e.place].filter(Boolean).join(' '))}">${e.time ? esc(e.time) + ' ' : ''}${esc(e.title)}${e.place ? `<small>${esc(e.place)}</small>` : ''}</a>`
        : `<button class="ev" ${can('schedule') ? `data-edit-event="${esc(e.id)}"` : ''} title="${esc([e.title, e.time, e.place].filter(Boolean).join(' '))}">${e.time ? esc(e.time) + ' ' : ''}${esc(e.title)}${e.place ? `<small>${esc(e.place)}</small>` : ''}</button>`).join('')}</div>`;
  }
  const monthEvs = evs.filter(e => e.date.startsWith(state.calMonth));
  const upcoming = evs.filter(e => e.date >= today);
  const jumpTo = (upcoming[0] || evs[evs.length - 1]);
  return `<div class="page-head"><h2 class="en">SCHEDULE</h2><button class="btn primary" data-add-event>+ 일정 등록</button></div>
    <div class="cal-head"><button class="btn" data-month="-1" aria-label="이전 달">‹</button><h3 class="ko">${y}년 ${m}월</h3><button class="btn" data-month="1" aria-label="다음 달">›</button><button class="btn" data-month="0">오늘</button></div>
    <div class="cal">${cells}</div>
    <div class="evlist">${monthEvs.length ? monthEvs.map(eventItem).join('') : `<p class="empty">이번 달에는 일정이 없어요.${jumpTo ? ` <button class="btn" data-jump="${jumpTo.date.slice(0, 7)}" style="margin-left:6px">가까운 일정 보기</button>` : ''}</p>`}</div>`;
}

function fitHomeSchedule() {
  const box = document.getElementById('homeEvs'); if (!box) return;
  const items = [...box.querySelectorAll('.mini-ev')];
  items.forEach(el => el.style.display = '');
  const news = document.querySelector('.home-grid > section:first-child');
  if (!news || getComputedStyle(document.querySelector('.home-grid')).gridTemplateColumns.split(' ').length < 2) return; // 폰: 3개만 (CSS)
  const limit = Math.max(...[...news.children].map(c => c.getBoundingClientRect().bottom));
  const footer = box.parentElement.querySelector('.more, [data-add-event]:last-of-type');
  const reserve = footer ? footer.getBoundingClientRect().height + 14 : 50;
  items.forEach((el, i) => { if (i >= 3 && el.getBoundingClientRect().bottom > limit - reserve) el.style.display = 'none'; });
  // 앞에서 숨긴 뒤 위치가 바뀌므로 한 번 더 확인
  items.forEach((el, i) => { if (i >= 3 && el.style.display !== 'none' && el.getBoundingClientRect().bottom > limit - reserve) el.style.display = 'none'; });
}

function topScorer(g) {
  const all = [...g.a.map(p => ({ ...p, team: g.teamA })), ...g.b.map(p => ({ ...p, team: g.teamB }))];
  return all.sort((x, y) => y.pts - x.pts)[0];
}
function scoreboard(g) {
  const aw = g.scoreA > g.scoreB, bw = g.scoreB > g.scoreA, ts = topScorer(g);
  return `<button class="sb" data-game="${g.id}">
    <div class="sb-top"><span>${esc(g.label)} MATCH</span><span>FINAL</span></div>
    <div class="sb-row ${aw ? 'w' : 'l'}"><span class="tn">${uniDot(g.date, g.teamA)}${esc(g.teamA)}</span><span class="sc en num">${g.scoreA}</span></div>
    <div class="sb-row ${bw ? 'w' : 'l'}"><span class="tn">${uniDot(g.date, g.teamB)}${esc(g.teamB)}</span><span class="sc en num">${g.scoreB}</span></div>
    ${ts ? `<div class="sb-foot">최다 득점 <b>${esc(ts.name)}</b> ${ts.pts}점<span class="go">박스스코어 ›</span></div>` : ''}</button>`;
}

function mipList(s) {
  const idx = state.seasons.indexOf(s), prev = state.seasons[idx + 1];
  if (!prev || !s.games.length) return { prev, list: [] };
  const before = Object.fromEntries(eligible(prev.stats).map(p => [p.name, p]));
  const list = eligible(s.stats).map(p => {
    const b = before[p.name];
    if (!b || b.avg.mvp < MIP_MIN_PREV) return null;
    return { name: p.name, team: p.team, gp: p.gp, prev: b.avg.mvp, now: p.avg.mvp, rate: (p.avg.mvp - b.avg.mvp) / b.avg.mvp };
  }).filter(x => x && x.rate > 0).sort((a, b) => b.rate - a.rate);

}

// 팀 경기당 기록 (게스트 포함 팀 전체 합계 기준)
function teamStats(s) {
  const t = {};
  for (const g of s.games) for (const [team, rows] of [[g.teamA, g.a], [g.teamB, g.b]]) {
    const x = t[team] || (t[team] = { gp: 0 }); x.gp++;
    rows.forEach(p => KEYS.forEach(k => x[k] = (x[k] || 0) + p[k]));
  }
  Object.values(t).forEach(x => {
    const per = k => x.gp ? (x[k] || 0) / x.gp : null;
    x.avg = { reb: per('reb'), oreb: per('oreb'), dreb: per('dreb'), ast: per('ast'), stl: per('stl'), blk: per('blk'), to: per('to'),
      fgp: x.fga ? x.fgm / x.fga * 100 : null, tpp: x.tpa ? x.tpm / x.tpa * 100 : null, ftp: x.fta ? x.ftm / x.fta * 100 : null };
  });
  return t;
}
function standingsTable(s) {
  const st = s.standings, ts = teamStats(s), played = s.games.length > 0;
  const cols = [
    ['ppg', '득점', t => t.gp ? t.pf / t.gp : null, 'max'], ['opp', '실점', t => t.gp ? t.pa / t.gp : null, 'min'],
    ['diff', '득실차', t => t.pf - t.pa, 'max'],
    ['reb', '리바', t => ts[t.team]?.avg.reb, 'max'], ['ast', '어시', t => ts[t.team]?.avg.ast, 'max'],
    ['stl', '스틸', t => ts[t.team]?.avg.stl, 'max'], ['blk', '블록', t => ts[t.team]?.avg.blk, 'max'],
    ['to', '턴오버', t => ts[t.team]?.avg.to, 'min'],
    ['fgp', 'FG%', t => ts[t.team]?.avg.fgp, 'max'], ['tpp', '3P%', t => ts[t.team]?.avg.tpp, 'max'], ['ftp', 'FT%', t => ts[t.team]?.avg.ftp, 'max'],
  ];
  const best = {};
  if (played) cols.forEach(([k, , fn, dir]) => { const v = st.map(fn).filter(x => x !== null && x !== undefined); if (v.length) best[k] = dir === 'max' ? Math.max(...v) : Math.min(...v); });
  const cell = (k, v) => {
    if (v === null || v === undefined) return '<td class="num">–</td>';
    const txt = k === 'diff' ? (v > 0 ? '+' : '') + v : /p$/.test(k) && k !== 'opp' ? pct(v) : f1(v);
    return `<td class="num ${played && v === best[k] ? 'best' : ''}">${txt}</td>`;
  };
  return `<p class="swipe-hint">← 옆으로 밀면 팀 기록이 더 있어요 →</p><div class="tbl-wrap st-wrap"><table class="st-table"><thead>
      <tr class="grp"><th colspan="6"></th><th colspan="3">경기당 득실</th><th colspan="5">경기당 팀 기록</th><th colspan="3">성공률</th></tr>
      <tr><th>순위</th><th class="l sticky-col">팀</th><th>경기</th><th>승</th><th>패</th><th>승률</th>${cols.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>
    ${st.map((t, i) => `<tr><td class="num">${i + 1}</td><td class="l sticky-col"><b>${esc(t.team)}</b></td><td class="num">${t.gp}</td><td class="num">${t.w}</td><td class="num">${t.l}</td><td class="num">${t.gp ? (t.w / t.gp).toFixed(3).replace(/^0/, '') : '–'}</td>${cols.map(([k, , fn]) => cell(k, fn(t))).join('')}</tr>`).join('')}
    </tbody></table></div>
    ${played ? '<p class="muted" style="font-size:.84rem;margin:8px 2px 0">모두 경기당 평균이에요. 색으로 표시된 칸이 그 항목 1위 팀이에요 (실점과 턴오버는 적을수록 1위). 팀 기록은 게스트 기록까지 포함한 팀 전체 합계예요.</p>' : ''}`;
}

function rosterBlocks(s) {
  const byName = Object.fromEntries(s.stats.map(p => [p.name, p]));

    const names = (s.rosters[t.team] || []).filter(n => !placed.has(n));
    s.stats.filter(p => p.team === t.team && !placed.has(p.name) && !names.includes(p.name)).forEach(p => names.push(p.name));
    names.forEach(n => placed.add(n));
    const ps = names.map(n => byName[n] || { name: n, gp: 0, avg: {} }).sort((a, b) => (b.avg.mvp || -99) - (a.avg.mvp || -99));
    return `<div class="team-block"><div class="tb-head"><span class="tb-rank en">${i + 1}</span><h3 class="ko">${esc(t.team)}</h3><span class="muted num">${t.w}승 ${t.l}패, ${ps.length}명</span></div>
      <div class="pgrid">${ps.map(p => playerCard(p, true)).join('')}</div></div>`;
  });
  return blocks.join('');
}

  if (CONFIG.banner || builtIn) {
    hero.classList.add('has-banner');
    hero.innerHTML = `<a href="#/home"><img class="banner" alt="${esc(CONFIG.teamName)} 농구팀"></a><h1 class="sr-only">${esc(CONFIG.teamName)}</h1>`;
    const img = hero.querySelector('img');
    const fallback = builtIn ? 'data:image/jpeg;base64,' + builtIn : '';
    img.onerror = () => { if (fallback && img.src !== fallback) img.src = fallback; };
    img.src = CONFIG.banner || fallback;
    img.addEventListener('load', () => hero.style.setProperty('--banner-bg', `url("${img.src}")`), { once: true });
    // 모션 배너: 영상 파일이 있으면 그림 위에 재생, 없거나 못 읽으면 그림 그대로
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (CONFIG.bannerVideo && CONFIG.bannerVideo.length && !reduce) {
      const v = document.createElement('video');
      v.className = 'banner banner-video'; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
      v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('aria-hidden', 'true'); v.preload = 'auto';
      CONFIG.bannerVideo.forEach(src => { const s = document.createElement('source'); s.src = src; s.type = /\.webm$/i.test(src) ? 'video/webm' : 'video/mp4'; v.appendChild(s); });
      v.addEventListener('playing', () => { img.replaceWith(v); }, { once: true });
      v.play().catch(() => {});
    }
    return;
  }
  hero.innerHTML = `${CONFIG.heroImage ? `<img class="hero-img" src="${esc(CONFIG.heroImage)}" alt="">` : ''}
    <div class="wrap"><a class="mark" href="#/home">${CONFIG.logo ? `<img class="logo" src="${esc(CONFIG.logo)}" alt="">` : ''}<div><h1 class="en">${esc(CONFIG.teamName)}</h1>${CONFIG.slogan ? `<p class="slogan">${esc(CONFIG.slogan)}</p>` : ''}</div></a></div>`;
}
function render() {
  if (!state.seasons.length) return;
  const parts = location.hash.split('/'), page = parts[1] || 'home', arg = parts[2];
  const pages = { home: pageHome, schedule: pageSchedule, league: pageLeague, players: pagePlayers, stats: pageStats, watch: pageWatch };
  const vid = page === 'watch' && arg === 'v' && parts[3] ? parts[3] : '';
  const html = vid ? pageWatchVideo(vid) : page === 'player' && arg ? pagePlayer(decodeURIComponent(arg)) : (pages[page] || pageHome)();
  // 영상 재생 중에 데이터가 새로 들어와도 플레이어를 다시 만들지 않아요 (재생이 끊기지 않게)
  const keep = vid && document.querySelector(`#wv-frame iframe[data-id="${vid}"]`);
  const src = state.seasons.map(s => `${s.name}: ${s.source === 'live' ? '구글 시트에서 실시간' : s.source === 'archive' ? '보관된 기록' : `저장된 데이터 (${SNAP_DATE} 기준)`}`).join(' / ');
  const who = state.role ? `${state.role === 'admin' ? '관리자' : '일정 관리'}로 로그인됨 <button class="link-btn" data-logout>로그아웃</button>` : '';
  const kept = {}; document.querySelectorAll('#view [data-keep]').forEach(el => kept[el.dataset.keep] = el.value);
  const focusKey = document.activeElement?.dataset?.keep, caret = document.activeElement?.selectionStart;
  $('#view').innerHTML = html + `<p class="status">${esc(src)}${FB ? '' : FB_EXPECTED ? ' / ⚠️ 저장 기능을 불러오지 못했어요. 새로고침해주세요' : ' / 데모 모드: 일정·영상·공지는 이 브라우저에만 저장돼요 (일정 비번 1234, 관리자 비번 admin)'}${who ? '<br>' + who : ''}</p>`;
  if (keep) { const f = document.getElementById('wv-frame'); f.innerHTML = ''; f.appendChild(keep); }
  document.querySelectorAll('#view [data-keep]').forEach(el => { if (kept[el.dataset.keep] !== undefined) el.value = kept[el.dataset.keep]; if (el.dataset.keep === focusKey) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} } });
  requestAnimationFrame(fitHomeSchedule);
  const navKey = page === 'player' ? 'players' : (pages[page] ? page : 'home');
  document.querySelectorAll('.nav a').forEach(a => a.getAttribute('href') === '#/' + navKey ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
}
const scrollMemo = {};
window.addEventListener('hashchange', e => {
  const oldHash = (e.oldURL.split('#')[1] || '');
  state.cameFromSite = true;
  scrollMemo['#' + oldHash] = lastScroll;
  render();
  // 영상 화면에서 뒤로 오면 보던 위치로, 그 외에는 맨 위로
  const back = oldHash.includes('/watch/v/') && scrollMemo[location.hash] !== undefined;
  if (location.hash.includes('/watch/v/')) {
    // 영상 화면: 배너를 건너뛰고 플레이어가 화면에 꽉 차게 보이도록 스크롤
    const top = document.querySelector('.wv-top'), nav = document.querySelector('.navbar');
    window.scrollTo(0, top ? top.getBoundingClientRect().top + window.scrollY - (nav ? nav.offsetHeight : 0) : 0);
  } else window.scrollTo(0, back ? scrollMemo[location.hash] : 0);
});
let lastScroll = 0; window.addEventListener('scroll', () => { lastScroll = window.scrollY; }, { passive: true });
let lastCheer = 0;
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-cheer-form]'); if (!f) return;
  e.preventDefault();
  const text = f.ctext.value.trim(), name = f.cname.value.trim().slice(0, 20);
  if (!text) { f.ctext.focus(); return; }
  if (Date.now() - lastCheer < 10000) { alert('조금만 있다가 다시 남겨주세요.'); return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    await store.add('cheers', { target: f.dataset.cheerForm, season: f.dataset.season, player: f.dataset.player, name, text: text.slice(0, 100), createdAt: new Date().toISOString() });
    lastCheer = Date.now();
    f.ctext.value = ''; const k = document.querySelector(`[data-keep="${f.dataset.cheerForm}-text"]`); if (k) k.value = '';
    try { localStorage.setItem('cheer-name', name); } catch (err) {}
  } catch (err) { alert(errMsg(err)); }
  btn.disabled = false;
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-vseason]')) { state.videoSeason = e.target.value; return render(); }
  if (e.target.matches('[data-season]')) {
    const v = e.target.value;
    if (v === 'career') state.statScope = 'career'; else { state.statScope = null; state.seasonId = v; }
    render();
  }
});
document.addEventListener('click', e => {
  const t = e.target.closest('button,a');
  if (!t) return;
  const d = t.dataset;
  if (d.game) return openBox(d.game);
  if (d.cat) { state.statCat = d.cat; state.showAll = false; return render(); }
  if (d.sort) { state.sortKey = d.sort; return render(); }
  if (d.pos) { state.posFilter = d.pos; return render(); }
  if (d.week) { state.leagueWeek[season().id] = +d.week; return render(); }
  if ('showall' in d) { state.showAll = !state.showAll; return render(); }
  if ('newsAll' in d) { state.newsAll = !state.newsAll; return render(); }
  if (d.jump) { state.calMonth = d.jump; return render(); }
  if (d.month !== undefined) {
    const n = +d.month;
    if (n === 0) state.calMonth = ymd(new Date()).slice(0, 7);
    else { const [y, m] = state.calMonth.split('-').map(Number); state.calMonth = ymd(new Date(y, m - 1 + n, 1)).slice(0, 7); }
    return render();
  }
  if (d.yt) { t.closest('.frame').innerHTML = `<iframe src="https://www.youtube.com/embed/${d.yt}?autoplay=1" title="경기 영상" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`; return; }
  if (d.editMember) { e.preventDefault(); return editMember(d.editMember); }
  if (d.editName) { e.preventDefault(); return withMember(d.editName, editMember); }
  if (d.photoName) { e.preventDefault(); return withMember(d.photoName, photoMember); }
  if ('adminMode' in d) return withAuth('admin', () => render());
  if ('addMember' in d) return addMember();
  if ('importMembers' in d) return withAuth('admin', () => importMembers().catch(err => alert(errMsg(err))));
  if ('addEvent' in d) return addEvent();
  if (d.editLeague) { e.preventDefault(); return editLeague(d.editLeague, d.title, d.season); }
  if (d.editEvent) { e.preventDefault(); return editEvent(d.editEvent); }
  if ('addVideo' in d) return addVideo(d.addVideo);
  if (d.vcat) { state.videoCat = d.vcat; state.videoSeason = 'all'; return render(); }
  if ('back' in d) { if (history.length > 1 && document.referrer !== undefined && state.cameFromSite) history.back(); else location.hash = '#/watch'; return; }
  if (d.editVideo) return editVideo(d.editVideo);
  if ('addNews' in d) return addNews();
  if (d.editNews) return editNews(d.editNews);
  if (d.del) { const [c, id] = d.del.split(':'); if (confirm('정말 삭제할까요?')) store.remove(c, id).catch(err => alert(errMsg(err))); return; }
  if ('logout' in d) return logout();
  if (d.cheerMore) { state.cheerAll[d.cheerMore] = !state.cheerAll[d.cheerMore]; return render(); }
  if (d.emo) { const inp = t.closest('.cheers').querySelector('[name=ctext]'); inp.value = (inp.value + ' ' + d.emo).trim().slice(0, 100); inp.focus(); return; }
  if (d.goweek) {
    const [sid, w] = d.goweek.split(':');
    state.seasonId = sid; state.leagueWeek[sid] = +w;
  }
});

async function loadFeed() {
  const ch = CONFIG.youtubeChannelId;
  if (!ch) return;
  try {
    const rss = encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id=' + ch);
    const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + rss);
    const data = await res.json();
    if (data.status !== 'ok' || !Array.isArray(data.items)) return;
    state.feed = data.items.map(it => ({ url: it.link || '', title: it.title || '', date: String(it.pubDate || '').slice(0, 10), category: 'feed' }))
      .filter(v => ytId(v.url));
    render();
  } catch (e) { /* 목록을 못 가져와도 위의 채널 플레이어는 그대로 동작 */ }
}

(async function start() {
  renderHero();
  if (FB) {
    firebase.initializeApp(FIREBASE);
    fdb = firebase.firestore(); fauth = firebase.auth();
    DYN.forEach(c => fdb.collection(c).onSnapshot(s => { state[c] = s.docs.map(x => ({ id: x.id, ...x.data() })); render(); }, err => console.error(c, err)));
    fauth.onAuthStateChanged(u => { state.role = roleOf(u); render(); });
  } else { demo = demoLoad(); DYN.forEach(c => state[c] = demo[c] = demo[c] || []); }
  state.seasons = await loadAllSeasons();
  state.seasonId = state.seasons[0]?.id;
  if (!state.seasons.length) { $('#view').innerHTML = '<p class="empty sec">기록 시트를 불러오지 못했어요. CONFIG의 sheetId와 시트 공유 설정을 확인하세요.</p>'; return; }
  render();
  loadFeed();
})();
</script>
